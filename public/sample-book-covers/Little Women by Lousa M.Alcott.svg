<svg width="300" height="450" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#D69E2E;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#D69E2Edd;stop-opacity:1" />
      </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="300" height="450" fill="url(#bgGradient)"/>
    
    <!-- Decorative elements -->
    <circle cx="250" cy="50" r="30" fill="#F6E05E" opacity="0.3"/>
    <circle cx="50" cy="400" r="40" fill="#F6E05E" opacity="0.2"/>
    
    <!-- Title -->
    <text x="150" y="180" text-anchor="middle" fill="#F7FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
      <tspan x="150" dy="0">Little Women; Or,</tspan>
      <tspan x="150" dy="30">Meg, Jo, Beth, an...</tspan>
    </text>
    
    <!-- Separator line -->
    <line x1="50" y1="250" x2="250" y2="250" stroke="#F6E05E" stroke-width="2"/>
    
    <!-- Author -->
    <text x="150" y="290" text-anchor="middle" fill="#F7FAFC" font-family="Arial, sans-serif" font-size="16" opacity="0.9">
      by Louisa May Alcott
    </text>
    
    <!-- Book icon -->
    <rect x="130" y="320" width="40" height="50" fill="none" stroke="#F6E05E" stroke-width="2" rx="3"/>
    <line x1="135" y1="330" x2="165" y2="330" stroke="#F6E05E" stroke-width="1"/>
    <line x1="135" y1="340" x2="165" y2="340" stroke="#F6E05E" stroke-width="1"/>
    <line x1="135" y1="350" x2="165" y2="350" stroke="#F6E05E" stroke-width="1"/>
  </svg>