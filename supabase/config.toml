# Supabase Configuration for Edge Functions
# This file configures Supabase CLI for local development and deployment

project_id = "fnnzwnamzhpdjfhozouh"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

# Individual function configurations
[functions.subscriptions]
verify_jwt = true

[functions.products]
verify_jwt = false

[functions.increment-usage]
verify_jwt = true

[functions.dodo-webhook]
verify_jwt = false

