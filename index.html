<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      performance.mark('head-start');
      window.addEventListener('DOMContentLoaded', () => {
        performance.mark('dom-content-loaded');
        performance.measure('dom-to-dcl', 'head-start', 'dom-content-loaded');
        const m = performance.getEntriesByName('dom-to-dcl')[0];
        if (m) console.log('[Perf] DOMContentLoaded at', m.duration.toFixed(0), 'ms');
      });
      window.addEventListener('load', () => {
        performance.mark('window-load');
        performance.measure('dom-to-load', 'head-start', 'window-load');
        const m = performance.getEntriesByName('dom-to-load')[0];
        if (m) console.log('[Perf] window.load at', m.duration.toFixed(0), 'ms');
      });
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RDBQXF9CLH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-RDBQXF9CLH');
    </script>
    <!-- End Google tag (gtag.js) -->

    <title>Ebook Reader</title>

    <!-- Removed blocking JSZip/ePub.js; using ESM imports -->

    <div id="root"></div>

  </body>
</html>
