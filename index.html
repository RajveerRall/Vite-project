    <!-- Critical CSS - Inline to prevent render blocking -->
    <style>
      /* Critical CSS - Above the fold styles only */
      
      /* Essential layout and typography */
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
        color: #1f2937;
      }
      
      /* Critical header styles */
      .header {
        background: white;
        border-bottom: 1px solid #e5e7eb;
        padding: 1rem 0;
        position: sticky;
        top: 0;
        z-index: 50;
      }
      
      .header-content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      /* Critical library grid styles */
      .library {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      
      .books-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
      }
      
      .book-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        overflow: hidden;
        transition: all 0.2s ease;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      
      .book-cover {
        aspect-ratio: 2/3;
        background-color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      
      .book-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      
      /* Loading states */
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      
      .loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #4a69bd;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Essential responsive utilities */
      @media (max-width: 640px) {
        .books-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 0.75rem;
        }
        
        .library {
          padding: 1rem;
        }
      }
      
      @media (max-width: 768px) {
        .header-content {
          padding: 0 0.75rem;
        }
        
        .library {
          padding: 1.5rem 1rem;
        }
      }
    </style>
