<h1 class="calibre9" id="calibre_pb_1">BOOK ONE</h1>

<div class="chapter-title-decoration-below" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7"><div class="calibre4"><img class="chapter-title-corner-decoration-left" src="../images/00004.jpeg" alt="image"/></div></div></div><p class="calibre15">When the barriers were weak, they came in. They were smoke and mirrors. They were dust and mist. They stole into our minds as smoke under a door. They slid through our thoughts as oil in water. We welcomed them. We wanted them. We were them.</p>
<p class="calibre16">-Tales of the Faewald</p>
