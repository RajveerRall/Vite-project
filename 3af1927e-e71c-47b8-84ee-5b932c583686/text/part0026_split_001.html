<div class="chapter-title">
<h1 class="calibre9" id="calibre_pb_1">BOOK TWO</h1>

<div class="chapter-title-decoration-below" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7"><div class="calibre4"><img class="chapter-title-corner-decoration-left" src="../images/00004.jpeg" alt="image"/></div></div></div><p class="calibre15">Music to bind,</p>
<p class="calibre15">Fire to blind,</p>
<p class="calibre15">Look in their eye,</p>
<p class="calibre15">With Iron they die.</p>
<p class="calibre16">-Tales of the Faewald</p>
<p class="section-break-symbol" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">***</p><div class="decoration-scene-break"><div class="decoration-scene-break-inner"><img src="../images/00005.jpeg" class="decoration-scene-break1" alt="image"/></div></div>
<p class="calibre15">In a ring but deep you go,</p>
<p class="calibre15">In a spot the wind can’t blow,</p>
<p class="calibre15">Buried deep but not in dirt,</p>
<p class="calibre15">Hold your breath, with death you flirt.</p>
<p class="calibre16">-Tales of the Faewald</p>
