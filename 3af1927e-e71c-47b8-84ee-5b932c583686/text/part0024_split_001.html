<div class="chapter-title-decoration-below" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7"><div class="calibre4"><img class="chapter-title-corner-decoration-left" src="../images/00004.jpeg" alt="image"/></div></div></div><p class="first-in-chapter"><span><span class="first-in-chapter1">W</span>hen I was four years</span> old, Hulanna gave me her teddy bear because mine fell in the fire. Even though it was her favorite. Even though my parents couldn’t afford to replace it.</p>
